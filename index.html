<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Brainly</title>

<link rel="manifest" href="manifest.json" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#FAFAFF" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Brainly" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />

<style>
  html, body { margin: 0; padding: 0; background: #FAFAFF; }
  #root { min-height: 100vh; }
  #boot-loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, sans-serif; color: #8B87A6; font-size: 14px;
  }
</style>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/marked@11.1.1/marked.min.js" crossorigin></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="root"><div id="boot-loading">loading brainly…</div></div>

  <script>
    // If something goes wrong before the app mounts, show the real error
    // instead of leaving "loading brainly…" up forever with no clue why.
    window.addEventListener("error", (e) => {
      const boot = document.getElementById("boot-loading");
      if (boot) {
        boot.textContent = "Something failed to load: " + (e.message || "unknown error") + " — try refreshing, or check that react.js and app.js both loaded (view page source / dev tools).";
        boot.style.color = "#E03E3E";
        boot.style.padding = "20px";
        boot.style.textAlign = "center";
      }
    });
  </script>

  <script src="app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
